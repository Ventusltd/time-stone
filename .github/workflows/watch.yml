name: watch

# The time stone. Once an hour, on GitHub's machine, in a few seconds: ask what changed, write down
# only what changed. No assistant, no paid credit, no clone. It commits only when something changed.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ventusltd/kuiper-belt
          path: kb
          sparse-checkout: tools
      - name: Watch, and fail closed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/watch.py
      - name: Commit only what changed
        run: |
          git config user.name "time-stone"
          git config user.email "actions@users.noreply.github.com"
          git add ledger.tsv site.tsv NOW.md
          git diff --cached --quiet && exit 0
          git commit -q -m "watch: what changed"
          git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
